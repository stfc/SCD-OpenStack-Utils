{% extends "base.html" %}
{% block title %}Page Not Found – {{ site_title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-page__code">404</div>
  <h1 class="error-page__title">Page Not Found</h1>
  <p class="error-page__message">The page you are looking for does not exist or has been moved.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn--primary">Return to Dashboard</a>
</div>
{% endblock %}
