{% extends "base.html" %}
{% block title %}Access Denied – {{ site_title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-page__code">403</div>
  <h1 class="error-page__title">Access Denied</h1>

  <a href="{{ url_for('main.index') }}" class="btn btn--primary">Return to Dashboard</a>
</div>
{% endblock %}
